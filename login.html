<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KRA0S - Sign In</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="login-wrapper">
    <div class="login-card">
      <div class="login-header">
        <div class="logo" style="justify-content: center; margin-bottom: 1rem;">
          <div class="logo-icon"></div>
          <span style="color:black">KRA0S</span>
        </div>
        <h1>Welcome back</h1>
        <p>Sign in to access your MRI analysis dashboard</p>
      </div>
      
      <form id="loginForm">
        <div class="form-group">
          <label for="email">Email address</label>
          <input type="email" id="email" placeholder="you@example.com" required>
        </div>
        
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="••••••••" required>
        </div>
        
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
          <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer; font-size: 0.9rem;">
            <input type="checkbox" style="width: auto;">
            <span>Remember me</span>
          </label>
          <a href="#" style="color: var(--primary); font-size: 0.9rem; font-weight: 600;">Forgot password?</a>
        </div>
        
        <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; padding: 0.85rem;">
          Sign In
        </button>
      </form>
      
      <div class="login-footer">
        Don't have an account? <a href="#">Sign up</a>
      </div>
    </div>
  </div>
  
  <script src="js/main.js"></script>
</body>
</html>
